<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="40%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#2e2219"/>
      <stop offset="60%" stop-color="#1f1712"/>
      <stop offset="100%" stop-color="#130e0b"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#33271e"/>
      <stop offset="100%" stop-color="#211913"/>
    </radialGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ef8a4c"/>
      <stop offset="60%" stop-color="#cf5f2c"/>
      <stop offset="100%" stop-color="#a83f1c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- minimap disc -->
  <circle cx="512" cy="512" r="360" fill="url(#disc)"/>
  <circle cx="512" cy="512" r="360" fill="none" stroke="#e8ddc9" stroke-opacity="0.12" stroke-width="12"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="#e8ddc9" stroke-opacity="0.06" stroke-width="8"/>
  <!-- heading sweep (moss accent) -->
  <path d="M512 512 L512 152 A360 360 0 0 1 748 268 Z" fill="#5c8b6b" fill-opacity="0.16"/>

  <!-- compass needle -->
  <g>
    <!-- south half: light warm grey -->
    <path d="M512 512 L602 452 L512 848 L422 452 Z" fill="#cdbfa8"/>
    <!-- north half: amber -->
    <path d="M512 512 L602 572 L512 176 L422 572 Z" fill="url(#north)"/>
    <!-- side flares -->
    <path d="M512 512 L724 512 L566 456 Z" fill="#cf5f2c" fill-opacity="0.6"/>
    <path d="M512 512 L300 512 L458 456 Z" fill="#cf5f2c" fill-opacity="0.6"/>
    <!-- pivot -->
    <circle cx="512" cy="512" r="52" fill="#1a130f"/>
    <circle cx="512" cy="512" r="52" fill="none" stroke="#ef8a4c" stroke-width="16"/>
    <circle cx="512" cy="512" r="14" fill="#f6b184"/>
  </g>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>
</svg>
