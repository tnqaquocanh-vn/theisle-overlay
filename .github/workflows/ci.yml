# PUBLIC repo (tnqaquocanh-vn/theisle-overlay) — CI for the private source.
#
# Triggered by the private repo's dispatch.yml (workflow_dispatch API) on every
# push, or by hand:
#   gh workflow run ci.yml --repo tnqaquocanh-vn/theisle-overlay -f source_ref=<sha>
#
# NO pull_request / pull_request_target trigger — this repo takes no code PRs.

name: CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA in theisle-overlay-src to check"
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event.inputs.source_ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    secrets: inherit
    with:
      source_ref: ${{ github.event.inputs.source_ref }}

  # R1b (v2 campaign): the screenshot suite runs — BLOCKING, with the config's
  # 2 CI retries absorbing a residual sub-pixel blip — as a step inside
  # gate.yml's `app` job (the pinned windows-2022 canonical environment). The
  # old non-blocking `visual` job here was pure duplication and is gone; its
  # env-manifest step moved into the `app` job. A spec that stays flaky after
  # R1b is quarantined by name (test.skip + a tracking issue + a <=14-day
  # deadline) — never by softening the whole job again.
