name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte/TypeScript check
        run: npm run check

      - name: i18n drift check
        run: node scripts/check-i18n.mjs

      - name: Design-token drift check
        run: node scripts/gen-tokens.mjs --check

      - name: Frontend build
        run: npm run build

      - name: Bundle-size budget (B3)
        run: node scripts/check-bundle-size.mjs

      - name: Forbidden Win32 API tripwire
        shell: pwsh
        run: ./scripts/check-forbidden-apis.ps1

      # Load-bearing since telemetry: the release workflow derives the signing
      # key from package.json's version and the app sends Cargo.toml's, so a
      # drift means every request from that release is rejected.
      - name: Version consistency
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

  # Visual-regression + render() perf tripwire. Screenshot baselines are
  # inherently machine-specific — GitHub's windows-latest renders text a
  # sub-pixel differently from a local Win11 box, so this job REPORTS but
  # never fails the build (continue-on-error). Regenerate baselines with
  # `npm run test:visual:update` when you deliberately change the UI.
  visual:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Visual + perf specs
        run: npm run test:visual

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        working-directory: worker
        run: npm ci
      - name: Typecheck
        working-directory: worker
        run: npm run typecheck
