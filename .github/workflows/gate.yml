# PUBLIC repo (tnqaquocanh-vn/theisle-overlay) — reusable gate.
#
# Checks out the PRIVATE source at `source_ref` via SRC_READ_PAT, then runs the
# same checks the old private-repo gate did. Called by ci.yml (branch pushes)
# and release.yml (tags) with `secrets: inherit`.
#
# R1 (v2 campaign): the `app` job is pinned to `windows-2022` (never
# `windows-latest`) — it is the canonical environment for `test:visual:screens`,
# which runs here as a BLOCKING step. playwright.config.ts (in the checked-out
# source) pins the rest: exact @playwright/test, DPR, locale, timezone, colour
# scheme, motion. ci.yml keeps a second non-blocking `visual` job as a canary
# that also records the runner env manifest.

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Commit SHA or tag in theisle-overlay-src to check out. Empty = its default branch."
        required: false
        type: string
        default: ""

jobs:
  app:
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - name: Check out the private source
        uses: actions/checkout@v5
        with:
          repository: tnqaquocanh-vn/theisle-overlay-src
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte/TypeScript check
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright Chromium (pinned by the lockfile)
        run: npx playwright install chromium

      - name: Record the canonical environment (to the job log)
        # R1a — no upload-artifact (the R-10 audit keeps these workflows
        # artifact-free). Printed so a screenshot drift after a GitHub
        # runner-image bump is diagnosable from the log alone. Baseline
        # (re)capture is done LOCALLY on Windows under option B.
        shell: pwsh
        run: |
          $pw = (npm ls @playwright/test --json | ConvertFrom-Json).dependencies.'@playwright/test'.version
          [ordered]@{
            imageVersion = $env:ImageVersion
            osBuild      = (Get-CimInstance Win32_OperatingSystem).BuildNumber
            runner       = "$env:RUNNER_OS $env:RUNNER_ARCH"
            playwright   = $pw
            chromium     = "$(npx playwright --version)"
            node         = "$(node --version)"
            sourceRef    = "${{ inputs.source_ref }}"
          } | ConvertTo-Json
          if (Test-Path node_modules/@fontsource) {
            "--- @fontsource woff2 SHA256 ---"
            Get-ChildItem -Recurse -Filter *.woff2 node_modules/@fontsource |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0}  {1}" -f $_.Hash, ($_.Path -replace [regex]::Escape($PWD.Path), '') }
          }

      - name: Visual regression specs
        # R1b — BLOCKING. Screenshot baselines are Windows (*-chromium-win32.png)
        # so this runs in the `app` job (the pinned windows-2022 canonical env);
        # playwright.config.ts's 2 CI retries absorb a residual sub-pixel blip
        # while a real regression fails all three. Excludes @logic (no
        # screenshot assertions — they run in e2e-logic). A spec that stays
        # flaky is quarantined by name (test.skip + tracking issue + <=14-day
        # deadline), never by softening this step.
        run: npm run test:visual:screens

      - name: i18n drift check
        run: node scripts/check-i18n.mjs

      - name: Species-data coverage check
        run: node scripts/check-species-data.mjs

      - name: Design-token drift check
        run: node scripts/gen-tokens.mjs --check

      - name: Minimap HUD layout drift check
        # Guarded: the script only exists on the v2 campaign branch until that
        # work merges. `if -f` keeps the node exit code, so a real drift still
        # fails; a missing script just skips.
        shell: bash
        run: |
          if [ -f scripts/check-minimap-layout.mjs ]; then
            node scripts/check-minimap-layout.mjs
          else
            echo "scripts/check-minimap-layout.mjs not on this ref — skipped"
          fi

      - name: Legacy --color-* budget ratchet (M3a)
        # Guarded like the layout check — v2-campaign only until it merges. The
        # count of var(--color-*) references may only ever drop as M3b/M3c
        # migrate call sites onto tokens / @theme utilities.
        shell: bash
        run: |
          if [ -f scripts/check-color-token-budget.mjs ]; then
            node scripts/check-color-token-budget.mjs
          else
            echo "scripts/check-color-token-budget.mjs not on this ref — skipped"
          fi

      - name: Frontend build
        run: npm run build

      - name: Bundle-size budget (B3)
        run: node scripts/check-bundle-size.mjs

      - name: Entrypoint cold-start budget (M3a)
        # Guarded — v2-campaign only until it merges. Per-HTML-entry
        # dependency-closure ceiling on top of the per-chunk B3 budget.
        shell: bash
        run: |
          if [ -f scripts/check-entrypoint-budget.mjs ]; then
            node scripts/check-entrypoint-budget.mjs
          else
            echo "scripts/check-entrypoint-budget.mjs not on this ref — skipped"
          fi

      - name: Forbidden Win32 API tripwire
        shell: pwsh
        run: ./scripts/check-forbidden-apis.ps1

      - name: Version consistency
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@v5
        with:
          repository: tnqaquocanh-vn/theisle-overlay-src
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        working-directory: worker
        run: npm ci
      - name: Typecheck
        working-directory: worker
        run: npm run typecheck
      - name: Test
        working-directory: worker
        run: npm test

  e2e-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the private source
        uses: actions/checkout@v5
        with:
          repository: tnqaquocanh-vn/theisle-overlay-src
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SRC_READ_PAT }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Logic specs
        run: npm run test:e2e:logic
