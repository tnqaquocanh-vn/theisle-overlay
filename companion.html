<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>companion</title>
    <style>
      /* A7 — the second-monitor companion. A PLAIN window (title bar, taskbar),
         not an overlay: it paints its own opaque Amber ground. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-bg, #0c0f0a);
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/companion/main.ts"></script>
  </body>
</html>
